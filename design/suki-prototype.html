<title>Suki Redesign Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Onest:wght@400;500;600&family=Sometype+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout concept: Studio. Home opens with the brief; work is reviewed as 9:16 frames.
   Violet marks what Suki wrote, ink marks what a person decided. The veil gradient is
   for marketing, sign-up and the brand page only, never behind working controls. */
:root{
  --bg:#ffffff;--panel:#f7f5fa;--sunk:#efecf6;--ink:#1a1523;--muted:#655f73;--line:#e3dfec;
  --signal:#7c3aed;--signal-soft:#efe7ff;--deep:#24084f;--brand-deep:#3d0f86;--lilac:#e4d4ff;--r-icon:22.5%;
  --ok:#11704f;--ok-soft:#e1f4ec;--warn:#8a5a00;--warn-soft:#fdf1dc;--bad:#b3261e;--bad-soft:#fde8e6;
  --inv-bg:#1a1523;--inv-fg:#ffffff;
  --t1:#e6defa;--t2:#dcefe3;--t3:#fbe3d6;--frame-ink:#1a1523;
  --r-ctl:6px;--r-surf:10px;
  --display:"Gabarito",system-ui,sans-serif;
  --sans:"Onest",system-ui,sans-serif;
  --mono:"Sometype Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--display);font-weight:var(--dw);letter-spacing:var(--dls);line-height:1.12;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
em.s{font-family:var(--acc);font-style:italic;font-weight:var(--accw);letter-spacing:var(--accls)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--inv-bg);background:var(--inv-bg);color:var(--inv-fg);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform 150ms ease-out,opacity 150ms ease-out,background-color 150ms ease-out}
.btn:not(:disabled):active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--sunk)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.lg{height:42px;padding:0 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px}
.field>span{font-weight:500;font-size:13px}
.input{width:100%;min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--bg)}

textarea.input{resize:vertical;min-height:84px}
.hint{font-size:12px;color:var(--muted)}

/* three badge roles: status (icon + word), tag (plain), source (underlined text) */
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.st svg{width:12px;height:12px;flex:none}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.bad{background:var(--bad-soft);color:var(--bad)}
.st.you{background:var(--ink);color:#fff}.st.suki{background:var(--signal-soft);color:var(--signal)}
.st.idle{background:var(--sunk);color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--muted)}
.src{font-size:12px;color:var(--muted);border-bottom:1px dotted var(--muted)}

/* storyboard frame: stands in for a rendered concept video */
.frame{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:8px;overflow:hidden;background:var(--t1);color:var(--frame-ink);display:flex;flex-direction:column;justify-content:space-between;padding:10px;min-width:0}
.frame.a2{background:var(--t2)}.frame.a3{background:var(--t3)}
.frame .who{font-size:11px;font-weight:500;opacity:.75}
.frame .hook{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.15;letter-spacing:-.01em}
.frame .bottle{position:absolute;left:50%;top:46%;width:22%;transform:translate(-50%,-50%);opacity:.9}
.bottle i{display:block;margin:0 auto;background:var(--frame-ink)}
.bottle .cap{width:34%;height:0;padding-bottom:26%;border-radius:3px 3px 0 0}
.bottle .neck{width:52%;height:0;padding-bottom:10%}
.bottle .body{width:100%;height:0;padding-bottom:170%;background:transparent;border:2px solid var(--frame-ink);border-radius:6px;position:relative}
.bottle .body::after{content:"";position:absolute;inset:55% 0 0 0;background:var(--frame-ink);opacity:.18}
.frame.sm{padding:6px;border-radius:5px}.frame.sm .hook{font-size:9px}.frame.sm .who{font-size:8px}

/* app shell */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.logo{display:inline-flex;align-items:center;gap:8px;color:inherit;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.03em;padding:0 8px;background:none;border:0;cursor:pointer;text-align:left}
.navg{display:grid;gap:2px}
.navg .label{padding:0 8px 4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:30px;padding:0 8px;border:0;border-radius:var(--r-ctl);background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:500;white-space:nowrap}
.nav:hover{color:var(--ink);background:var(--sunk)}
.nav[aria-current]{color:var(--ink);background:var(--sunk);box-shadow:inset 2px 0 0 var(--ink)}
.count{font-family:var(--mono);font-size:11px;line-height:18px;min-width:18px;padding:0 5px;border-radius:999px;text-align:center;background:var(--ink);color:#fff;font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;display:grid;gap:8px}
.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 10px;border:1px dashed var(--line);border-radius:var(--r-ctl);margin-bottom:22px}
.shell.top{display:block}
.topbar{display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}
.topbar .navg{display:flex;gap:2px}.topbar .nav{width:auto}.topbar .nav[aria-current]{box-shadow:inset 0 -2px 0 var(--ink)}
.topbar .sp{flex:1}
@media (max-width:820px){
  .shell{display:block}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side .navg{display:flex}.side .navg .label,.side .foot{display:none}.side .nav{width:auto}
  .nav[aria-current]{box-shadow:none}
}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.ph h1{font-size:30px}
.ph p{color:var(--muted);max-width:62ch;margin-top:6px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-surf);background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--sunk)}
.cname{font-family:var(--display);font-weight:600;font-size:15px;background:none;border:0;padding:0;cursor:pointer;text-align:left}

.surf{border:1px solid var(--line);border-radius:var(--r-surf);background:var(--panel)}
.grid{display:grid;gap:16px}
.rule{border:0;border-top:1px solid var(--line);margin:0}

/* stage rail */
.rail{display:flex;border:1px solid var(--line);border-radius:var(--r-surf);background:var(--panel);overflow-x:auto;margin-bottom:22px}
.rail button{flex:1 0 auto;display:grid;gap:2px;text-align:left;padding:10px 14px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;min-width:104px;color:var(--muted)}
.rail button:last-child{border-right:0}
.rail button:hover{background:var(--sunk)}
.rail .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.rail .t{font-weight:600;font-size:13px;color:var(--ink);display:flex;gap:6px;align-items:center}
.rail .s{font-size:12px}
.rail button[aria-current]{box-shadow:inset 0 -2px 0 var(--ink);background:var(--sunk)}
.rail button.todo .t{color:var(--muted);font-weight:500}

/* review */
.rev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:20px;align-items:start}
@media (max-width:960px){.rev{grid-template-columns:1fr}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ccard{display:grid;gap:8px;text-align:left;background:none;border:0;padding:6px;border-radius:12px;cursor:pointer;min-width:0}
.ccard:hover{background:var(--sunk)}
.ccard[aria-pressed="true"]{background:var(--sunk);box-shadow:0 0 0 1.5px var(--ink)}
.ccard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.detail{padding:18px;display:grid;gap:16px;position:sticky;top:16px}
.detail h2{font-size:19px}
.beats{display:grid;gap:10px}
.beats div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
.checks{display:grid;gap:8px}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;padding:10px;border-radius:var(--r-ctl);background:var(--sunk);font-size:13px}
.check.warn{background:var(--warn-soft)}.check.bad{background:var(--bad-soft)}
.check del{color:var(--muted)}.check ins{text-decoration:none;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* working state */
.work{padding:20px;display:grid;gap:14px;max-width:640px}
.steps{display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);justify-self:center}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.now{border-color:var(--signal);background:var(--signal)}
@media (prefers-reduced-motion:no-preference){.dot.now{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}

/* matrix */
.mx th[scope=row]{position:sticky;left:0;background:var(--panel);text-transform:none;letter-spacing:0;font-size:13px;vertical-align:top;border-right:1px solid var(--line)}
.mx td{vertical-align:top;min-width:200px}
.mx thead th{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);vertical-align:top}
.mx thead b{font-family:var(--display);font-size:16px;display:block}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.cols2{grid-template-columns:1fr}}
.list{display:grid}
.list li{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.list li:first-child{border-top:0}
.sec{padding:18px}
.sec h2{font-size:17px;margin-bottom:4px}

/* landing */
.lnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;max-width:1160px;margin:0 auto}
.lpad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lw{max-width:1160px;margin:0 auto}
.hero{padding-block:56px 48px}
.hero h1{font-size:clamp(38px,6.6vw,80px);font-weight:var(--hw);letter-spacing:var(--hls);line-height:1}
.hero .sub{font-size:17px;color:var(--muted);max-width:52ch;margin-top:18px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;align-items:center}
.sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);margin-top:52px}
.sheet>div{padding:16px 16px 20px 0;border-right:1px solid var(--line);display:grid;gap:8px;align-content:start;min-width:0}
.sheet>div+div{padding-left:16px}.sheet>div:last-child{border-right:0}
.sheet h3{font-size:18px}
@media (max-width:820px){.sheet{grid-template-columns:1fr 1fr}.sheet>div{border-bottom:1px solid var(--line)}}
@media (max-width:480px){.sheet{grid-template-columns:1fr}.sheet>div,.sheet>div+div{padding-left:0;border-right:0}}
.composer{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;display:grid;gap:12px;text-align:left;max-width:680px;width:100%;margin:0 auto}
.composer textarea{border:0;background:transparent;resize:none;min-height:64px;font-size:16px;outline:0;width:100%}
.composer .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--bg);font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--sunk)}
.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}.center .cta{justify-content:center}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.band{border-top:1px solid var(--line);padding-block:48px}
.band h2{font-size:clamp(24px,3.2vw,34px);max-width:24ch}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:28px}
@media (max-width:820px){.three{grid-template-columns:1fr}}
.three h3{font-size:17px;margin-bottom:6px}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.auth .media{background:var(--inv-bg);color:var(--inv-fg);padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.auth .media .trio{max-width:420px}
.auth .form{display:grid;place-items:center;padding-block:40px}
.auth .box{width:100%;max-width:340px;display:grid;gap:14px}
.auth h1{font-size:26px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.prog{display:flex;gap:4px}.prog i{height:3px;width:22px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--ink)}
@media (max-width:820px){.auth{grid-template-columns:1fr}.auth .media{display:none}}
.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-surf);cursor:pointer;background:var(--panel)}
.pick:has(input:checked){border-color:var(--ink)}
.pick input{margin-top:3px;accent-color:var(--ink)}

/* board (darkroom home) */
.board{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.colh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.colh h2{font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{padding:14px;display:grid;gap:10px;text-align:left;cursor:pointer;color:inherit;width:100%}
.card:hover{border-color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);padding:9px 14px;border-radius:var(--r-ctl);font-weight:500;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin 200ms var(--ease)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

/* brand */
.mark{width:var(--s,24px);height:var(--s,24px);border-radius:var(--r-icon);overflow:hidden;display:inline-block;flex:none;vertical-align:middle}
.mark img{width:100%;height:100%;max-width:none;display:block;transform:scale(1.22)}
@media (prefers-reduced-motion:no-preference){.bob{animation:bob 1.8s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-3px)}}
.veil{position:relative;overflow:hidden;border-radius:14px;color:#1a1523;background:
  radial-gradient(120% 90% at 0% 100%,#f7b3dc 0%,rgba(247,179,220,.55) 28%,rgba(247,179,220,0) 58%),
  radial-gradient(90% 80% at 100% 0%,#b79cf9 0%,rgba(183,156,249,.5) 30%,rgba(183,156,249,0) 62%),
  linear-gradient(135deg,#f3ecff 0%,#e2d4fd 40%,#c4acfb 75%,#a78bfa 100%)}
.veil::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 1px,transparent 1px 13px);-webkit-mask-image:radial-gradient(85% 75% at 15% 100%,#000 25%,transparent 70%);mask-image:radial-gradient(85% 75% at 15% 100%,#000 25%,transparent 70%)}
.veil.deep{color:#fff;background:
  radial-gradient(100% 90% at 100% 100%,#a855f7 0%,rgba(168,85,247,.5) 30%,rgba(168,85,247,0) 62%),
  linear-gradient(160deg,#24084f 0%,#3d0f86 100%)}
.veil.deep::after{background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 13px);-webkit-mask-image:radial-gradient(80% 80% at 100% 100%,#000 20%,transparent 70%);mask-image:radial-gradient(80% 80% at 100% 100%,#000 20%,transparent 70%)}
.veil>*{position:relative;z-index:1}
.veil .label{color:inherit;opacity:.75}
.kick{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:4px 8px;border:1px solid currentColor;border-radius:5px}
.panels{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:10px;margin-top:44px}
.panels>.veil{padding:20px;display:grid;gap:18px;align-content:space-between;min-height:340px}
@media (max-width:860px){.panels{grid-template-columns:1fr}.panels>.veil{min-height:0}}
.bignum{font-family:var(--mono);font-size:56px;line-height:1;letter-spacing:-.06em}
.ticks{display:grid;gap:8px}.ticks li{display:flex;gap:8px;align-items:center}.ticks svg{width:14px;height:14px;flex:none}
.auth .media.veil{border-radius:0}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sw div{display:grid;gap:6px;min-width:0}.sw i{display:block;height:64px;border-radius:var(--r-surf);border:1px solid var(--line)}
.spec{display:grid;gap:18px}
.spec>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:baseline;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:640px){.spec>div{grid-template-columns:1fr;gap:4px}}
.dd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.dd{grid-template-columns:1fr}}
.needs{display:grid;margin-bottom:28px}
.needs button{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;width:100%;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:inherit}
.needs button:last-child{border-bottom:1px solid var(--line)}
.needs button:hover{background:var(--panel)}
/* type: Gabarito for headings, Onest for interface text, Sometype Mono for labels and accent italics */
body{--dw:600;--dls:-.015em;--hw:500;--hls:-.03em;--acc:var(--mono);--accw:400;--accls:-.07em;

function campaign(){
  const head=`<div class="crumb"><button data-go="home">Campaigns</button><span>/</span><span>Hydration that fits real mornings</span></div>
  <div class="ph"><div><h1>Hydration that fits real mornings</h1><p>4D Hyaluronic Acid Serum · Organic · Round 1 · due <span class="num">Nov 21</span></p></div></div>${rail()}`;
  let body='';
  if(S.stage==='review') body=review();
  else if(S.stage==='playbooks') body=playbooks();
  else if(S.stage==='brief') body=`<div class="surf sec grid" style="max-width:720px"><div><span class="label">Brief</span><p style="font-size:16px;margin-top:4px">Show the serum as one quick, easy step in very different daily routines.</p></div><hr class="rule"><div class="cols2"><div><span class="label">Key message</span><p>One lightweight step on damp skin, morning and night.</p></div><div><span class="label">Audience</span><p>People who want simple skincare that fits a busy day</p></div></div><div class="acts"><button class="btn sec" data-go="new">Edit brief</button></div></div>`;
  else if(S.stage==='signoff') body=signoff();
  else body=`<div class="surf sec" style="max-width:640px"><h2>${STAGES.find(s=>s[0]===S.stage)[1]}</h2><p class="muted">This stage keeps its current behaviour. It is not mocked up in this prototype. Review, Playbooks, Brief and Sign-off are.</p></div>`;
  return head+body;
}
function review(){
  const c=S.concepts.find(x=>x.id===S.sel)||S.concepts[0],a=ACC[c.a-1];
  const iss=c.issue;
  let checks=`<div class="check"><span>${st('ok','Pass')}</span><span>Voice matches ${a.name}: ${a.voice.toLowerCase()}.</span></div>`;
  if(iss&&c.status!=='ok') checks=`<div class="check ${c.status}"><span>${st(c.status,c.status==='warn'?'Fix':'Blocked')}</span><span><b>${iss.t}.</b> ${iss.from?`Script says “<del>${iss.from}</del>”.`:''} ${iss.to?`Suggested: <ins>${iss.to}</ins>.`:'There is no approved wording to swap in, so this line has to be rewritten.'} <span class="src">Brand Brain · ${iss.src}</span></span></div>`+checks;
  else if(iss) checks=`<div class="check"><span>${st('ok','Fixed')}</span><span>${iss.to} <span class="src">Brand Brain · ${iss.src}</span></span></div>`+checks;
  checks+=`<div class="check"><span>${st('ok','Pass')}</span><span>No words from the avoid list.</span></div>`;
  let acts;
  if(c.approved) acts=`${st('ok','Approved by you')}<button class="btn ghost" data-act="unapprove">Undo</button>`;
  else if(c.status==='ok') acts=`<button class="btn" data-act="approve">Approve</button><button class="btn sec" data-act="changes">Request changes</button>`;
  else if(c.status==='warn') acts=`<button class="btn" data-act="fix">Apply suggested fix</button><button class="btn sec" data-act="changes">Request changes</button>`;
  else acts=`<button class="btn" data-act="rewrite">Ask Suki to rewrite</button><button class="btn sec" disabled title="Blocked concepts cannot be approved">Approve</button>`;
  const ready=approved()===6;
  return `<div class="rev"><section><div class="colh"><h2>${approved()} of 6 approved</h2><span class="muted" style="font-size:13px">${need()} to review${blocked()?`, ${blocked()} blocked`:''}</span><span style="flex:1"></span><button class="btn sec" data-stage="signoff"${ready?'':' disabled title="Approve every concept first"'}>Move to sign-off</button></div>
  <div class="cgrid">${S.concepts.map(x=>`<button class="ccard" data-sel="${x.id}" aria-pressed="${x.id===c.id}">${frame(x.a,ACC[x.a-1].h,x.hook)}<span class="meta">${badge(x)}<span>${x.fmt}</span></span></button>`).join('')}</div></section>
  <aside class="surf detail"><div><span class="label">${a.name} · ${a.p} · ${c.fmt}</span><h2 style="margin-top:6px">${c.hook}</h2></div>
  <div class="beats">${['Hook','Scenes','CTA'].map((b,i)=>`<div><span class="label" style="padding-top:2px">${b}</span><span>${c.beats[i]}</span></div>`).join('')}</div>
  <hr class="rule"><div><span class="label">Brand checks</span><div class="checks" style="margin-top:8px">${checks}</div></div>
  <div class="acts">${acts}</div><p class="hint">Drafted by Suki from the ${a.name} playbook. A person approves every concept before sign-off.</p></aside></div>`;
}
function playbooks(){
  const steps=['Reading the brief and Brand Brain','Playbook for Student Finds','Playbook for Mom Essentials','Playbook for Beauty Finds'];
  if(S.pb==='idle') return `<div class="surf work"><h2 style="font-size:19px">Three playbooks are written</h2><p class="muted">One per account. Each sets the angle, hook patterns and what to avoid, using only approved facts and claims.</p><div class="list">${ACC.map(a=>`<li><span><b>${a.name}</b> <span class="muted">· ${a.voice}</span></span>${st('ok','Written')}</li>`).join('')}</div><div class="acts"><button class="btn" data-stage="review">Open review</button><button class="btn sec" data-act="redraft">Draft again</button></div></div>`;
  const done=S.pb==='done';
  return `<div class="surf work" aria-live="polite"><div>${done?st('ok','Finished'):`<span style="display:flex;align-items:center;gap:8px">${mark(28,'bob')}${st('suki','Suki is working')}</span>`}<h2 style="font-size:19px;margin-top:8px">${done?'Playbooks are ready':'Drafting a playbook for each account'}</h2><p class="muted">${done?'Next, Suki drafts three concepts per account and checks each against the Brand Brain. You review them before anything is signed off.':'This takes under a minute. You can leave this page; nothing needs you yet.'}</p></div>
  <ol class="steps">${steps.map((t,i)=>`<li><i class="dot ${i<S.pbStep||done?'done':i===S.pbStep?'now':''}"></i><span${i>S.pbStep&&!done?' class="muted"':''}>${t}</span><span class="hint">${i<S.pbStep||done?'Done':i===S.pbStep?'Working':'Queued'}</span></li>`).join('')}</ol>
  <div class="acts"><button class="btn" data-stage="review"${done?'':' disabled'}>Review 6 concepts</button>${done?'':'<button class="btn sec" data-act="stop">Stop</button>'}</div></div>`;
}
function signoff(){
  const ready=approved()===6;
  return `<div class="surf work"><h2 style="font-size:19px">Sign off this round</h2><p class="muted">${ready?'All six concepts are approved and pass every brand check.':`${6-approved()} concepts still need a decision. Sign-off opens when all six are approved.`}</p><div class="list">${ACC.map(a=>{const cs=S.concepts.filter(c=>c.a===a.n),k=cs.filter(c=>c.approved).length;return `<li><span><b>${a.name}</b></span>${k===cs.length?st('ok',`${k} of ${cs.length} approved`):st('you',`${k} of ${cs.length} approved`)}</li>`}).join('')}</div><div class="acts"><button class="btn" data-act="signoff"${ready?'':' disabled'}>Sign off and export</button><button class="btn sec" data-stage="review">Back to review</button></div></div>`;
}

function trends(){

  return `<div class="veil deep" style="padding:28px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin-bottom:28px">${mark(96)}<div style="min-width:0;flex:1 1 320px"><span class="kick">BRAND DIRECTION</span><h1 style="font-size:clamp(30px,5vw,52px);font-weight:var(--hw);letter-spacing:var(--hls);margin-top:12px">Suki <em class="s">ghostwrites.</em> You sign.</h1><p style="opacity:.8;max-width:56ch;margin-top:10px">Suki is a ghostwriter: it drafts in each account's voice and stays out of the byline. The brand makes that visible. Violet is Suki's hand, ink is yours.</p></div></div>
  <div class="grid" style="gap:36px">
  <section><span class="label">01 / The ghost</span><h2 style="font-size:22px;margin:6px 0 12px">The mascot shows up only where Suki is acting</h2><div class="cols2"><div class="surf sec" style="display:flex;gap:12px;align-items:center">${mark(40,'bob')}<span><b>Drafting, checking, rewriting.</b><br><span class="muted">It bobs while Suki works and is still when the work is done.</span></span></div><div class="surf sec"><b>Never on a person's decision.</b><br><span class="muted">Approvals, sign-off and edits carry your name in ink, with no mascot and no violet.</span></div></div></section>
  <section><span class="label">02 / Colour</span><h2 style="font-size:22px;margin:6px 0 12px">Two voices, six colours</h2><div class="sw">${sw.map(([c,n,r])=>`<div><i style="background:${c}"></i><b>${n}</b><span class="label">${c}</span><span class="hint">${r}</span></div>`).join('')}</div><p class="hint" style="margin-top:12px">Green, amber and red are reserved for brand-check results and always carry an icon and a word.</p></section>
  <section><span class="label">03 / Type</span><h2 style="font-size:22px;margin:6px 0 12px">Three faces, three jobs</h2><div class="spec"><div><span class="label">${F().d}</span><span style="font-family:var(--display);font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.05">My 5-minute reset before the kids wake up</span></div><div><span class="label">${F().s}</span><span>Every screen, table and form. 14px in the app, 16px on marketing pages, never lighter than regular weight.</span></div><div><span class="label">${F().m}</span><span><span class="kick">01 / BRIEF</span> &nbsp;Stage numbers, labels, counts and dates. The italic accent (${F().a}) marks the one or two words a headline turns on: <em class="s" style="font-size:18px">every</em>.</span></div></div></section>
  <section><span class="label">04 / The veil</span><h2 style="font-size:22px;margin:6px 0 12px">One gradient, kept off the work surface</h2><div class="cols2"><div class="veil" style="min-height:150px;padding:16px"><span class="kick">LIGHT VEIL</span></div><div class="veil deep" style="min-height:150px;padding:16px"><span class="kick">DEEP VEIL</span></div></div><p class="muted" style="margin-top:12px;max-width:70ch">The veil is the ghost's trail. Use it on the landing page, sign-up, empty states and this page. It never sits behind tables, forms, review screens or anything a person has to read closely.</p></section>
  <section><span class="label">05 / Voice</span><h2 style="font-size:22px;margin:6px 0 12px">Plain, and honest about limits</h2><div class="dd">${dd(1,'“Suki has no live trend data.”')}${dd(0,'“AI-powered trend intelligence.”')}${dd(1,'“Wording is stronger than the approved claim.”')}${dd(0,'“Oops! Something looks off.”')}${dd(1,'“Drafted by Suki. Approved by you.”')}${dd(0,'“Generated with magic.”')}</div></section>
  <section><span class="label">06 / Shape</span><h2 style="font-size:22px;margin:6px 0 12px">Soft mascot, sharp tool</h2><p class="muted" style="max-width:70ch">The ghost is the only round thing. Controls use a 6px corner and surfaces 10px. Concepts always appear as 9:16 frames, because that is the shape of the finished work. Lines are one pixel; shadows are not used.</p></section></div>`;
}

function view(){
  const s=S.screen;
  if(s==='landing') return landing();
  if(s==='signup') return signup();
  if(s==='onboard') return onboard();
  return shell(s==='home'?homeStudio():s==='new'?newCamp():s==='campaign'?campaign():s==='brand'?brand():s==='accounts'?accounts():s==='guide'?guide():trends());
}
const F=()=>({d:'Gabarito',s:'Onest',m:'Sometype Mono',a:'Sometype Mono italic'});
const stage=document.getElementById('stage');
function paint(){stage.innerHTML=view()}
let toastT,pbT;
function toast(t){S.toast=t;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';paint()},2400)}
function go(s){S.screen=s;if(s==='signup')S.signup=1;if(s==='onboard')S.onb=1;paint();window.scrollTo(0,0)}
function runPlaybooks(){
  clearInterval(pbT);S.pb='working';S.pbStep=0;
  pbT=setInterval(()=>{S.pbStep++;if(S.pbStep>=4){S.pb='done';clearInterval(pbT)}if(S.screen==='campaign'&&S.stage==='playbooks')paint()},900);
}
stage.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-stage],[data-sel],[data-act]');
  if(!el||el.disabled)return;
  if(el.dataset.sel){S.sel=el.dataset.sel;if(el.dataset.go){S.stage='review';go(el.dataset.go)}else paint();return}
  if(el.dataset.go){if(el.dataset.go==='campaign'&&S.pb!=='working')S.stage='review';go(el.dataset.go);return}
  if(el.dataset.stage){S.stage=el.dataset.stage;if(S.stage==='playbooks'&&S.pb==='done')S.pb='idle';paint();return}
  const c=S.concepts.find(x=>x.id===S.sel),a=el.dataset.act;
  if(a==='approve'){c.approved=true;const n=S.concepts.find(x=>!x.approved&&x.status==='ok');toast('Approved');if(n)S.sel=n.id}
  else if(a==='unapprove'){c.approved=false}
  else if(a==='fix'){c.status='ok';toast('Fix applied. Checks passed')}
  else if(a==='rewrite'){c.status='ok';c.beats[1]='“This one is lightweight and absorbs fast, so it stayed.”';c.issue={to:'Rewritten with an approved claim: “Lightweight, fast-absorbing formula”.',src:'Marketing claim 1'};toast('Rewritten with approved wording')}
  else if(a==='changes'){toast('Sent back to Suki with your note')}
  else if(a==='signoff'){toast('Signed off. Export is ready')}
  else if(a==='redraft'){runPlaybooks()}
  else if(a==='stop'){clearInterval(pbT);S.pb='idle';toast('Stopped. The earlier playbooks are kept')}
  else if(a==='su-next'){S.signup=2}
  else if(a==='su-back'){S.signup=1}
  else if(a==='ob-skip'){go('home');return}
  else if(a==='noop'){toast('Add a reference keeps its current form')}
  paint();
});
stage.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target.dataset.form;
  if(f==='su1'){S.signup=2;paint()}
  else if(f==='su2'){go('onboard')}
  else if(f==='ob1'){S.onb=2;paint()}
  else if(f==='ob2'){go('home')}
  else if(f==='new'){S.stage='playbooks';runPlaybooks();go('campaign')}
});

paint();
</script>
